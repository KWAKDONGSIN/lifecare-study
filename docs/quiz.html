<script>window.QUIZ=[{"id": "87fd1aa3", "ch": "bio", "type": "short", "q": "DNA → RNA 과정의 이름은?", "answer": "전사", "alts": ["transcription"], "explain": "DNA는 설계도 원본이라 금고(핵)에서 못 나와요. 그래서 필요한 부분만 RNA로 베껴 쓰는데, 이 베껴 쓰기가 전사예요.", "src": "2주차 슬라이드 14"}, {"id": "38a68c74", "ch": "bio", "type": "short", "q": "RNA → 단백질 과정의 이름은?", "answer": "번역", "alts": ["translation"], "explain": "mRNA의 암호를 3글자(코돈)씩 읽고 맞는 아미노산을 이어서 단백질을 만드는 일이 번역이에요. 암호를 다른 말로 옮긴다고 생각하면 이름이 기억나요.", "src": "2주차 슬라이드 14"}, {"id": "b6ab3793", "ch": "bio", "type": "short", "q": "아미노산 하나를 지정하는 염기 3개 단위는?", "answer": "코돈", "alts": ["codon"], "explain": "염기 3글자가 한 묶음이 되어 아미노산 하나를 정해 줘요. 이 3글자 묶음의 이름이 코돈이에요.", "src": "2주차 슬라이드 22"}, {"id": "f8fe2675", "ch": "bio", "type": "mc", "q": "염기는 바뀌었지만 같은 아미노산이 만들어지는 점 돌연변이는?", "choices": ["미스센스", "넌센스", "침묵(silent)", "전좌"], "answer": 2, "explain": "글자(염기)가 바뀌었지만 결국 같은 아미노산이 만들어지면 단백질이 달라지지 않아요. 오타가 났는데 뜻은 같은 경우라서 침묵 돌연변이예요.", "src": "2주차 슬라이드 43"}, {"id": "57369dab", "ch": "bio", "type": "mc", "q": "종결 코돈이 생겨 단백질이 중간에 끊기는 돌연변이는?", "choices": ["넌센스", "미스센스", "침묵", "삽입"], "answer": 0, "explain": "바뀐 글자 때문에 갑자기 종결 코돈(멈춤 신호)이 생겨서 단백질이 중간에 끊겨요. 문장 한가운데 마침표가 찍힌 셈이라 넌센스예요. 미스센스는 아미노산만 바뀌는 경우라 달라요.", "src": "2주차 슬라이드 43"}, {"id": "b194e272", "ch": "bio", "type": "mc", "q": "겸상 적혈구 빈혈증(GAG→GTG, 글루탐산→발린)은 어떤 돌연변이의 예?", "choices": ["침묵", "넌센스", "미스센스", "구조 변이"], "answer": 2, "explain": "GAG가 GTG로 바뀌면서 글루탐산이 발린이라는 다른 아미노산으로 바뀌었어요. 아미노산이 다른 것으로 바뀌는 돌연변이가 미스센스예요. 단백질이 끊긴 것이 아니라서 넌센스는 아니에요.", "src": "2주차 슬라이드 44"}, {"id": "c0698cee", "ch": "bio", "type": "ox", "q": "G–C 결합은 수소결합 2개, A–T 결합은 3개라 A–T가 더 강하다.", "answer": false, "explain": "G-C는 수소결합(손잡는 힘)이 3개, A-T는 2개예요. 손을 3개 잡은 G-C가 더 튼튼하니 문장이 반대로 쓰여서 틀렸어요.", "src": "2주차 녹취"}, {"id": "e6bbef6a", "ch": "bio", "type": "ox", "q": "DNA 메틸화는 염기서열(글자)을 바꾸지 않고 유전자 발현만 조절한다.", "answer": true, "explain": "메틸화는 C에 작은 꼬리표(메틸기)를 붙이는 것이라 DNA 글자는 그대로예요. 글자는 안 바꾸고 스위치만 끄고 켜는 것이라서 맞는 말이에요.", "src": "2주차 슬라이드 36"}, {"id": "5783307c", "ch": "bio", "type": "mc", "q": "암에서 종양억제유전자 프로모터에 흔히 나타나는 변화는?", "choices": ["과메틸화(hyper)", "저메틸화(hypo)", "엑손 결실", "코돈 증가"], "answer": 0, "explain": "종양억제유전자는 암을 막는 브레이크예요. 그 유전자의 프로모터가 과메틸화되어 꺼지면 브레이크가 고장 나서 암이 생기기 쉬워져요. 저메틸화는 게놈 전체에서 나타나는 변화라서 이 문제의 답이 아니에요.", "src": "2주차 슬라이드 55"}, {"id": "9e80a784", "ch": "bio", "type": "short", "q": "사람 게놈은 약 몇 염기쌍인가?", "answer": "30억", "alts": ["3 billion", "3x10^9", "3×10⁹", "약 30억"], "explain": "사람 게놈은 약 30억 글자예요. 수업에서 3조라고 한 건 말실수니까 30억으로 외우세요.", "src": "2주차 슬라이드 16·56"}, {"id": "3b12d5f3", "ch": "bio", "type": "mc", "q": "RNA에서 T(티민) 대신 쓰는 염기는?", "choices": ["U(우라실)", "A(아데닌)", "C(사이토신)", "I(이노신)"], "answer": 0, "explain": "RNA에서는 T(티민) 대신 U(우라실)를 써서 A, U, G, C가 돼요. I(이노신)는 이 문제에서 헷갈리라고 넣은 보기예요.", "src": "2주차 슬라이드 21"}, {"id": "bdacd96d", "ch": "ngs", "type": "short", "q": "NGS 혁신의 핵심 원리를 영어 3단어로?", "answer": "Sequencing by Synthesis", "alts": ["SBS", "sequencing by synthesis"], "explain": "NGS의 핵심은 DNA를 합성하면서 동시에 형광으로 읽는 거예요. 영어로 Sequencing by Synthesis, 줄여서 SBS예요.", "src": "3주차 슬라이드 11"}, {"id": "a9f2a6e9", "ch": "ngs", "type": "mc", "q": "Illumina가 Roche를 이기고 시장을 차지한 가장 큰 이유는?", "choices": ["read 길이가 더 길어서", "1Gb당 비용이 훨씬 싸서", "런타임이 더 짧아서", "Emulsion PCR을 써서"], "answer": 1, "explain": "Illumina는 1Gb당 약 7달러, Roche는 9,500달러라서 Illumina가 훨씬 쌌어요. 읽는 길이와 속도는 오히려 Roche가 나았지만, 연구자들은 가격이 싼 쪽을 골랐어요.", "src": "3주차 슬라이드 19·20"}, {"id": "b1768eb1", "ch": "ngs", "type": "mc", "q": "Illumina가 클러스터를 만드는 방법은?", "choices": ["Emulsion PCR", "Bridge PCR", "Sanger 반응", "RT-PCR"], "answer": 1, "explain": "Illumina는 유리판 위에서 DNA가 다리(bridge)처럼 휘어 복사되는 Bridge PCR로 무리를 만들어요. Emulsion PCR은 Roche가 쓴 방법이라 헷갈리면 안 돼요.", "src": "3주차 슬라이드 14·15"}, {"id": "f5ae1335", "ch": "ngs", "type": "ox", "q": "Roche 454는 2016년에 사업을 접었다.", "answer": true, "explain": "슬라이드에 Roche 454가 2016년에 문을 닫았다고 적혀 있어요. 그래서 맞는 문장이에요.", "src": "3주차 슬라이드 20"}, {"id": "04d549c1", "ch": "ngs", "type": "mc", "q": "휴먼 게놈 프로젝트에 대한 설명으로 맞는 것은?", "choices": ["2010년 시작, 3년, 300만 달러", "1990~2003년, 13년, 30억 달러", "NGS로 수행", "Illumina가 주도"], "answer": 1, "explain": "휴먼 게놈 프로젝트는 1990년부터 2003년까지 13년 동안 약 30억 달러를 들여 했어요. NGS가 나오기 전이라 느린 Sanger 방식으로 했어요.", "src": "3주차 슬라이드 6"}, {"id": "dd18ea43", "ch": "fastq", "type": "short", "q": "FASTQ 한 read는 몇 줄로 되어 있나?", "answer": "4", "alts": ["4줄", "네 줄"], "explain": "FASTQ는 read 하나가 4줄이에요. 이름표(@), 염기서열, 구분선(+), 품질 점수 순서예요.", "src": "3주차 슬라이드 22"}, {"id": "a2eaa747", "ch": "fastq", "type": "mc", "q": "Phred Q30의 정확도는?", "choices": ["90%", "99%", "99.9%", "99.99%"], "answer": 2, "explain": "Q30은 잘못 읽을 확률이 1/1000이라서 정확도는 99.9%예요. 30의 앞자리 3은 0이 세 개라고 생각하면 외우기 쉬워요.", "src": "3주차 슬라이드 24"}, {"id": "0ec68479", "ch": "fastq", "type": "short", "q": "FASTQ 서열 줄의 N은 무슨 뜻?", "answer": "판별 못 한 염기", "alts": ["모르는 염기", "degenerate base", "읽지 못한 염기"], "explain": "N은 형광이 섞여서 A, T, G, C 중 무엇인지 알 수 없는 자리를 뜻해요. 모르는 글자를 물음표 대신 N으로 적은 거예요.", "src": "3주차 녹취"}, {"id": "53ce38b4", "ch": "fastq", "type": "mc", "q": "FASTA와 FASTQ의 차이로 맞는 것은?", "choices": ["FASTA에는 품질 점수가 있다", "FASTQ는 레퍼런스 파일이다", "FASTA는 >이름+서열, FASTQ는 4줄에 품질 점수 포함", "둘은 같은 형식이다"], "answer": 2, "explain": "FASTA는 이름 줄(>)과 서열만 있는 정답지 파일이고, FASTQ는 4줄에 품질 점수까지 있는 내 시퀀싱 결과예요. 품질 점수가 있는 쪽은 FASTQ라서 첫 보기는 틀려요.", "src": "7주차 슬라이드 32"}, {"id": "906e74af", "ch": "depth", "type": "mc", "q": "'한 위치를 몇 개의 read가 겹쳐 읽었는가'를 뜻하는 말은?", "choices": ["Coverage", "Depth", "Read length", "MAPQ"], "answer": 1, "explain": "한 위치를 read 몇 개가 겹쳐서 읽었는지가 depth예요. coverage는 전체 중 한 번이라도 읽힌 부분의 비율이라서 뜻이 달라요.", "src": "7주차 슬라이드 10"}, {"id": "5f631860", "ch": "depth", "type": "mc", "q": "아주 낮은 비율의 변이(암 조기진단)를 찾을 때 알맞은 방식은?", "choices": ["WGS 30x", "WES 50x", "Targeted 500x 이상", "Sanger"], "answer": 2, "explain": "암 초기처럼 변이 비율이 아주 낮으면 깊게 읽어야 찾아낼 수 있어요. 읽을 범위를 몇 개 유전자로 줄이면(Targeted) 500x 이상으로 깊게 읽을 수 있어요. WGS 30x는 얕아서 놓칠 수 있어요.", "src": "3주차 슬라이드 29·31"}, {"id": "b4fb4973", "ch": "depth", "type": "short", "q": "2×150의 뜻은?", "answer": "양쪽에서 150씩 읽는 페어드엔드", "alts": ["페어드엔드 150", "paired-end 150"], "explain": "2x150은 DNA 조각의 양쪽 끝에서 각각 150글자씩 읽는다는 뜻이에요. 이런 방식이 페어드엔드이고, R1과 R2 두 개의 read가 나와요.", "src": "7주차 슬라이드 8"}, {"id": "b91bf35e", "ch": "align", "type": "short", "q": "CIGAR 5M2I10M의 뜻은?", "answer": "5 매치, 2 삽입, 10 매치", "alts": ["5매치 2삽입 10매치"], "explain": "CIGAR는 숫자와 글자의 암호예요. 5M은 5개 일치, 2I는 2개 삽입, 10M은 10개 일치라서 5 일치, 2 삽입, 10 일치라고 읽어요.", "src": "7주차 슬라이드 44·45"}, {"id": "dd8c4ffc", "ch": "align", "type": "short", "q": "정렬된 BAM의 인덱스 파일 확장자는?", "answer": ".bai", "alts": ["bai"], "explain": "BAM 파일의 찾아보기(인덱스) 파일은 확장자가 .bai예요. BAM Index의 줄임말이에요.", "src": "7주차 슬라이드 56"}, {"id": "3e5d835d", "ch": "variant", "type": "short", "q": "GATK의 풀네임은?", "answer": "Genome Analysis Toolkit", "alts": ["genome analysis tool kit"], "explain": "GATK는 Genome Analysis Toolkit의 줄임말이에요. 하버드와 MIT가 함께 만든 Broad Institute에서 만들었어요.", "src": "7주차 슬라이드 71"}, {"id": "5c9ebda9", "ch": "variant", "type": "mc", "q": "VCF에서 GT가 0/0이면?", "choices": ["양쪽 다 변이", "한쪽만 변이", "변이 없음", "판단 불가"], "answer": 2, "explain": "VCF에서 0은 레퍼런스와 같은 글자, 1은 바뀐 글자예요. 0/0은 양쪽 모두 같다는 뜻이라 변이가 없어요. 0/1이나 1/1이어야 변이가 있어요.", "src": "7주차 슬라이드 77"}, {"id": "5718b6cf", "ch": "annot", "type": "mc", "q": "변이가 질병과 관련 있는지 확인하는 대표 DB는?", "choices": ["dbSNP", "1000 Genomes", "ClinVar", "refGene"], "answer": 2, "explain": "질병과 관련이 있는지는 ClinVar에 물어봐야 해요. dbSNP는 변이의 이름표, 1000 Genomes는 일반인에게 흔한지 알려 주는 DB라서 질병 여부는 모르는 곳이에요.", "src": "7주차 슬라이드 88"}, {"id": "dd0faf28", "ch": "bio", "type": "short", "q": "DNA 메틸화는 어떤 염기에 일어나나?", "answer": "사이토신", "alts": ["C", "시토신", "cytosine"], "explain": "DNA 메틸화는 사이토신(C)에 작은 꼬리표(메틸기)가 붙는 일이에요. 특히 C 다음에 G가 오는 CpG 자리에서 많이 일어나요.", "src": "2주차 슬라이드 36"}, {"id": "adad1fa9", "ch": "bio", "type": "mc", "q": "DNA에서 필요한 부분만 RNA로 옮겨 적는 과정(책 전체에서 필요한 페이지만 베끼는 것에 비유)의 이름은?", "choices": ["복제(replication)", "번역(translation)", "스플라이싱(splicing)", "전사(transcription)"], "answer": 3, "explain": "DNA에서 필요한 부분만 RNA로 베껴 쓰는 것이 전사예요. 복제는 DNA를 통째로 한 벌 더 만드는 것, 번역은 RNA로 단백질을 만드는 것, 스플라이싱은 RNA에서 필요한 부분만 이어 붙이는 가공이라 달라요.", "src": "2주차 녹취 / 기본생물학 슬라이드 14·24쪽"}, {"id": "8ee8d816", "ch": "bio", "type": "ox", "q": "모든 세포가 같은 DNA를 가지는데도 간세포와 뇌세포가 다른 것은, 세포마다 DNA 염기서열 자체가 다르기 때문이다.", "answer": false, "explain": "몸속 모든 세포는 같은 DNA를 가지고 있어요. 간세포와 뇌세포가 다른 이유는 글자가 달라서가 아니라 어느 유전자를 켜느냐(스위치)가 다르기 때문이에요. 그래서 이 문장은 틀려요.", "src": "2주차 녹취 / 기본생물학 슬라이드 12·34쪽"}, {"id": "17d8739c", "ch": "bio", "type": "mc", "q": "DNA 염기쌍에 대한 설명으로 맞는 것은?", "choices": ["G–C는 수소결합 3개라 A–T(2개)보다 단단하다", "A–T는 수소결합 3개라 G–C보다 단단하다", "G–C와 A–T 모두 수소결합이 2개다", "염기쌍은 수소결합이 아니라 공유결합으로 붙는다"], "answer": 0, "explain": "G-C는 수소결합이 3개, A-T는 2개라서 G-C가 더 단단해요. 염기쌍은 수소결합으로 붙고 공유결합이 아니에요. 그래서 첫 번째 보기가 맞아요.", "src": "2주차 녹취 / 기본생물학 슬라이드 15쪽, 4주차 녹취"}, {"id": "0624c6fe", "ch": "bio", "type": "mc", "q": "대체 스플라이싱(alternative splicing)의 결과로 가능한 것은?", "choices": ["DNA 염기서열이 바뀌어 새 유전자가 생긴다", "인트론이 단백질로 번역된다", "같은 RNA에서 엑손 조합을 달리해 여러 종류의 mRNA, 즉 여러 단백질이 만들어진다", "mRNA 하나가 여러 종류의 단백질을 동시에 만든다"], "answer": 2, "explain": "대체 스플라이싱은 엑손을 이어 붙이는 조합을 바꿔서 같은 유전자로 여러 종류의 mRNA와 단백질을 만드는 거예요. 한 mRNA가 여러 단백질을 동시에 만드는 것은 아니라서 마지막 보기는 함정이에요.", "src": "2주차 녹취 / 기본생물학 슬라이드 26쪽"}, {"id": "e9ef735e", "ch": "bio", "type": "mc", "q": "유전자 앞쪽 프로모터의 CpG 아일랜드가 메틸화되면 일반적으로 어떻게 되는가?", "choices": ["전사인자가 더 잘 붙어 발현이 증가한다", "염기서열이 바뀌어 돌연변이가 된다", "수소결합이 끊어져 이중나선이 풀린다", "메틸-CpG 결합 단백질이 자리를 막아 전사가 꺼진다(발현 OFF)"], "answer": 3, "explain": "프로모터는 유전자의 시작 스위치예요. 여기가 메틸화되면 결합 단백질이 자리를 막아서 전사인자가 붙지 못하고 유전자가 꺼져요. 메틸화는 글자를 바꾸지 않으므로 돌연변이가 아니에요.", "src": "2주차 녹취 / 기본생물학 슬라이드 36·54쪽"}, {"id": "0287635a", "ch": "bio", "type": "mc", "q": "점 돌연변이 때문에 종결 코돈이 생겨 단백질 합성이 도중에 끝나는 경우는?", "choices": ["침묵(silent) 변이", "넌센스(nonsense) 변이", "미스센스(missense) 변이", "구조 변이(전좌)"], "answer": 1, "explain": "글자가 바뀌어 종결 코돈(멈춤 신호)이 생기면 단백질 만들기가 중간에 끝나요. 이것이 넌센스예요. 침묵은 같은 아미노산, 미스센스는 다른 아미노산이 들어가는 경우예요.", "src": "2주차 녹취 / 기본생물학 슬라이드 43쪽"}, {"id": "88cb3caf", "ch": "bio", "type": "short", "q": "겸상 적혈구 빈혈증은 GAG(글루탐산)가 GTG(발린)로 한 글자 바뀌어 생긴다. 이 점 돌연변이의 종류는? (침묵 / 넌센스 / 미스센스 중)", "answer": "미스센스", "alts": ["미스센스 변이", "미스센스변이", "missense", "missense mutation"], "explain": "글루탐산이 발린이라는 다른 아미노산으로 바뀌었으니 미스센스예요. 멈춤 신호가 생긴 것이 아니라서 넌센스는 아니에요.", "src": "2주차 녹취 / 기본생물학 슬라이드 44쪽"}, {"id": "9bcc1577", "ch": "bio", "type": "ox", "q": "SNP는 어떤 위치에서 염기가 사람마다 다른 흔한 변이를 가리키고, allele(대립유전자)은 그 위치에 존재하는 각각의 형태(예 A 버전, G 버전)를 가리킨다.", "answer": true, "explain": "SNP는 어떤 자리에서 사람마다 글자가 다른 현상이고, allele은 그 자리의 각각의 버전(A 버전, G 버전)이에요. 그래서 설명이 맞아요.", "src": "2주차 녹취 / 기본생물학 슬라이드 46·47쪽"}, {"id": "8850f6bd", "ch": "bio", "type": "mc", "q": "개수 기준으로 인체에서 가장 많은 세포는?", "choices": ["근육세포", "간세포", "적혈구", "피부(상피)세포"], "answer": 2, "explain": "적혈구는 크기가 작아서 개수로는 압도적으로 많아요. 몸 세포의 80% 넘게 차지해요. 근육이나 피부 세포는 눈에 잘 띄지만 개수로는 훨씬 적어요.", "src": "2주차 녹취 / 기본생물학 슬라이드 10쪽"}, {"id": "6e8d1014", "ch": "bio", "type": "mc", "q": "BRCA1/BRCA2에 대한 설명으로 맞는 것은?", "choices": ["암세포의 증식을 막는 종양억제유전자이며, 변이가 있으면 발병률이 올라간다(100%는 아니다)", "암세포를 만드는 원암유전자라서 변이가 있으면 반드시 발병한다", "DNA 복제를 돕는 효소를 만드는 유전자다", "메틸화가 절대 일어나지 않는 유전자다"], "answer": 0, "explain": "BRCA1과 BRCA2는 암을 막아 주는 종양억제유전자라서 고장 나면 유방암 위험이 올라가요. 하지만 변이가 있다고 100% 암에 걸리는 것은 아니에요. 그래서 반드시 걸린다는 보기는 틀려요.", "src": "2주차 녹취 / 기본생물학 슬라이드 48~50쪽"}, {"id": "31064da2", "ch": "ngs", "type": "mc", "q": "Sanger 시퀀싱 대비 NGS가 바꾼 핵심 아이디어는?", "choices": ["형광 대신 전기 신호로 염기를 읽는다", "캐필러리를 더 굵고 길게 만들어 한 번에 더 많이 흘려보낸다", "PCR 증폭 단계를 완전히 없앤다", "DNA를 기판에 먼저 고정(Arrange)한 뒤 합성(Extend)하면서 동시에 이미징(Detect)한다"], "answer": 3, "explain": "Sanger는 다 만들어서 흘려보냈지만, NGS는 DNA를 판에 먼저 고정하고 만들면서 바로 사진을 찍어요. 순서를 바꾼 덕분에 수많은 DNA를 동시에 읽을 수 있어요. 형광을 안 쓰는 것도, PCR을 없앤 것도 아니에요.", "src": "3주차 녹취 / NGS 슬라이드 7·11쪽"}, {"id": "2a19b4a6", "ch": "ngs", "type": "ox", "q": "Sanger 시퀀싱에서는 형광 뉴클레오타이드가 붙으면 반응이 종결되어 길이가 다른 조각들이 만들어지고, 캐필러리에서는 짧은 조각이 먼저 통과한다.", "answer": true, "explain": "Sanger에서는 형광 염기가 붙으면 복사가 멈춰서 길이가 다른 조각이 생겨요. 가는 관에서는 짧은 조각이 먼저 통과해요. 나오는 순서대로 형광 색을 읽으면 서열을 알 수 있어서 맞는 말이에요.", "src": "3주차 녹취 / NGS 슬라이드 7쪽"}, {"id": "a018a3bc", "ch": "ngs", "type": "mc", "q": "NGS에서 한 스팟에 같은 DNA 약 1,000가닥을 모아 클러스터로 만드는 이유는?", "choices": ["서로 다른 DNA를 섞어 에러를 평균 내기 위해", "한 가닥의 형광은 너무 약해 이미징으로 보이지 않기 때문에", "중합효소를 아끼기 위해", "캐필러리에 흘려보내는 속도를 맞추기 위해"], "answer": 1, "explain": "DNA 한 가닥이 내는 형광은 너무 약해서 사진에 안 찍혀요. 그래서 같은 DNA를 1,000가닥쯤 모아 밝게 만들어요. 에러를 평균 내려는 것이 아니에요.", "src": "3주차 녹취 / NGS 슬라이드 11·12쪽"}, {"id": "e380f295", "ch": "ngs", "type": "mc", "q": "Illumina가 DNA 클론(클러스터)을 만들 때 쓴 방식은?", "choices": ["비드 위에서 기름 속 물방울로 격리하는 Emulsion PCR", "캐필러리 겔 전기영동", "유리 flow cell 위에서 DNA가 다리처럼 휘어 증폭하는 Bridge PCR", "피로인산이 효소 반응을 일으키는 pyrosequencing"], "answer": 2, "explain": "Illumina는 유리판(flow cell) 위에서 DNA가 다리처럼 휘어 복사되는 Bridge PCR을 써요. 기름방울과 구슬을 쓰는 Emulsion PCR은 Roche의 방식이에요.", "src": "3주차 녹취 / NGS 슬라이드 14·15쪽"}, {"id": "d4b40dfb", "ch": "ngs", "type": "mc", "q": "사이클마다 A, T, G, C 시약을 따로 흘려 주고 빛이 나는지(ON/OFF)로 염기를 판단하는 검출 방식은?", "choices": ["SNA (Single Nucleotide Addition)", "CRT (Cyclic Reversible Termination)", "Bridge PCR", "Sanger 종결법"], "answer": 0, "explain": "A, T, G, C 시약을 하나씩 따로 흘려서 빛이 나는지로 판단하는 방식은 SNA예요. Illumina의 CRT는 네 가지 색 형광을 한꺼번에 흘리는 방식이라서 달라요.", "src": "3주차 녹취 / NGS 슬라이드 17·18쪽"}, {"id": "2fc13c51", "ch": "ngs", "type": "ox", "q": "Illumina의 CRT는 ATGC에 서로 다른 형광이 달린 뉴클레오타이드를 한 번에 흘려 이미징하고, 형광을 잘라낸(cleavage) 뒤 다음 사이클로 넘어가며 약 150회 반복한다.", "answer": true, "explain": "Illumina의 CRT는 사진을 찍고, 형광을 잘라 내고, 다음 글자를 붙이는 과정을 약 150번 반복해요. 150번 하니까 읽은 길이가 150이 돼요. 그래서 맞는 말이에요.", "src": "3주차 녹취 / NGS 슬라이드 18쪽"}, {"id": "72b93209", "ch": "ngs", "type": "mc", "q": "교수님이 Illumina가 Roche를 이긴 ‘핵심 이유’라고 설명한 것은?", "choices": ["read length가 훨씬 길어서", "에러율이 낮아서(0.1% vs 1%)", "시퀀싱 시간이 훨씬 짧아서", "Gb당 비용이 압도적으로 싸서($7 vs $9,500)"], "answer": 3, "explain": "핵심 이유는 비용이에요. Illumina는 1Gb당 7달러, Roche는 9,500달러였어요. 읽는 길이와 시간은 Roche가 더 좋았고 에러율은 부차적인 이유예요.", "src": "3주차 녹취 / NGS 슬라이드 19·20쪽"}, {"id": "f51bac0b", "ch": "ngs", "type": "short", "q": "Illumina(HiSeq X)의 1Gb당 시퀀싱 비용은 약 몇 달러인가? (Roche는 9,500달러)", "answer": "7", "alts": ["7달러", "$7", "7 달러", "7불"], "explain": "Illumina는 1Gb(글자 10억 개)를 읽는 데 약 7달러가 들어요. Roche는 9,500달러라서 1,000배도 넘게 비싸요.", "src": "3주차 녹취 / NGS 슬라이드 20쪽"}, {"id": "7a13bcee", "ch": "ngs", "type": "mc", "q": "휴먼 게놈 프로젝트(1990~2003)에 대한 슬라이드 기준 설명으로 맞는 것은?", "choices": ["13년, 약 3조 달러", "13년, 약 30억 달러(US $3 billion)", "13년, 약 300만 달러", "3년, 약 30억 달러"], "answer": 1, "explain": "슬라이드에는 13년 동안 약 30억 달러(US $3 billion)라고 적혀 있어요. 수업 중에 3조 달러라고 한 건 말실수예요.", "src": "3주차 녹취 / NGS 슬라이드 6·9쪽"}, {"id": "8ebfb6d7", "ch": "ngs", "type": "mc", "q": "Illumina HiSeq X의 대표 스펙으로 맞는 것은?", "choices": ["read 약 700 bases, 에러 1% (indel)", "read 약 700 bases, 에러 0.1% (substitution)", "read 약 150 bases, 에러 0.1% (substitution)", "read 약 150 bases, 에러 1% (indel)"], "answer": 2, "explain": "Illumina는 read가 약 150 글자이고 에러율이 0.1%(주로 글자가 바뀌는 substitution)예요. 700글자와 에러 1% indel은 Roche의 특징이라서 섞이지 않게 조심하세요.", "src": "3주차 녹취 / NGS 슬라이드 19쪽"}, {"id": "c060c88e", "ch": "ngs", "type": "mc", "q": "PCR을 n사이클 반복하면 이론상 DNA 카피 수는 대략 몇 배가 되는가?", "choices": ["n배", "2n배", "n²배", "2ⁿ배"], "answer": 3, "explain": "PCR은 한 번 돌 때마다 DNA가 2배가 돼요. 2배씩 n번이면 2를 n번 곱한 2의 n제곱 배가 돼요. 예를 들어 10번이면 약 1,000배예요.", "src": "3주차 녹취 / NGS 슬라이드 13쪽"}, {"id": "b4a5f07a", "ch": "fastq", "type": "mc", "q": "FASTQ 첫 줄(ID)이 read마다 서로 달라야 하는 이유는?", "choices": ["ID가 flow cell 위의 위치(레인·타일·x,y 좌표)를 바탕으로 만들어져 스팟마다 고유하기 때문", "ID에 환자의 이름이 들어 있기 때문", "ID가 서열의 GC 비율로 자동 계산되기 때문", "ID가 퀄리티 점수의 평균값이기 때문"], "answer": 0, "explain": "FASTQ의 이름표는 판 위의 주소(레인, 타일, x, y 좌표)로 만들어져요. 점마다 주소가 다르니 이름표도 달라야 해요. 환자 이름이나 점수와는 관계가 없어요.", "src": "3주차 녹취 / NGS 슬라이드 23쪽"}, {"id": "ed87d73e", "ch": "fastq", "type": "ox", "q": "FASTQ 파일에 완전히 같은 ID가 두 번 나타나는 것은 정상이다.", "answer": false, "explain": "이름표는 판 위의 위치 주소라서 점마다 달라요. 같은 이름표가 두 번 나오면 오류예요. 그러니 정상이라는 말은 틀려요.", "src": "3주차 녹취 / NGS 슬라이드 23쪽"}, {"id": "57092a2c", "ch": "fastq", "type": "mc", "q": "Phred 점수 Q = −10 × log₁₀(P)에서 잘못 읽을 확률 P가 1/10,000이면 Q는?", "choices": ["4", "40", "30", "100"], "answer": 1, "explain": "확률 1/10,000은 10의 4제곱분의 1이라서 Q는 40이에요. 40이면 0이 4개라고 외우면 돼요. 정확도는 99.99%예요.", "src": "3주차 녹취 / NGS 슬라이드 24쪽"}, {"id": "4baf0c56", "ch": "fastq", "type": "short", "q": "Phred Q30의 염기 판독 정확도는 몇 %인가?", "answer": "99.9%", "alts": ["99.9", "99.9 %", "99.9퍼센트", "0.999"], "explain": "Q30은 에러가 1000번에 1번이라 정확도가 99.9%예요. 1/100이면 Q20이라서 헷갈리지 마세요. 보통 Q30 이상이면 품질 검사를 통과해요.", "src": "3주차 녹취 / NGS 슬라이드 24쪽"}, {"id": "19b16085", "ch": "fastq", "type": "mc", "q": "FASTQ 서열 줄에 나오는 N의 의미는?", "choices": ["정상(Normal) 염기", "삭제된 염기", "형광 신호가 섞여 염기를 판별하지 못한 자리(degenerate base)", "다음(Next) read로 이어진다는 표시"], "answer": 2, "explain": "N은 형광이 뒤섞여 어떤 글자인지 판단하지 못한 자리를 뜻해요. 그래서 잘못 읽었을 가능성이 커요. 정상이나 삭제 표시가 아니에요.", "src": "3주차 녹취 / NGS 슬라이드 22쪽"}, {"id": "81702d14", "ch": "fastq", "type": "mc", "q": "FASTQ의 네 번째 줄(퀄리티)은 어떻게 적혀 있는가?", "choices": ["염기마다 점수를 숫자로 이어 붙여 적는다", "read 전체의 평균 점수 하나만 적는다", "점수 대신 오류 확률(%)을 적는다", "염기마다 점수를 문자 하나로 인코딩해 적는다(Illumina 점수 0~41)"], "answer": 3, "explain": "품질 점수는 숫자를 그대로 쓰는 대신 글자 하나로 바꿔서 적어요. 그래야 염기 하나당 글자 하나로 서열과 길이가 딱 맞아요. 예를 들어 F는 37점이에요.", "src": "3주차 녹취 / NGS 슬라이드 24쪽"}, {"id": "5ac32f0d", "ch": "fastq", "type": "mc", "q": "FastQC의 ‘Per base sequence quality’ 그래프에서 노란 박스가 나타내는 것은?", "choices": ["품질값의 25%~75% 구간", "품질값의 평균", "품질값의 중앙값", "품질값의 최솟값과 최댓값"], "answer": 0, "explain": "FastQC 그래프에서 노란 박스는 품질값이 몰려 있는 25%에서 75% 구간이에요. 파란 선은 평균, 빨간 선은 중앙값이라서 박스와는 달라요.", "src": "4주차 녹취 / NGS 슬라이드 38쪽"}, {"id": "c3097d46", "ch": "fastq", "type": "ox", "q": "짧은 DNA 조각(예 100bp)도 기계는 150번 이미징하므로, 100번째 이후에는 노이즈만 찍혀 품질이 급락한다.", "answer": true, "explain": "조각이 짧아도 기계는 정해진 횟수(150번)만큼 사진을 찍어요. 조각이 끝난 뒤에는 읽을 진짜 DNA가 없어서 노이즈만 찍히고 품질이 뚝 떨어져요. 그래서 맞는 말이에요.", "src": "4주차 녹취 / NGS 슬라이드 38쪽"}, {"id": "6b059030", "ch": "depth", "type": "mc", "q": "어떤 염기 위치에 정렬된 read가 5개 겹쳐 있다. 이 위치의 depth는?", "choices": ["0.5x", "5%", "5x", "50x"], "answer": 2, "explain": "한 위치를 덮은 read가 5개면 depth는 5x예요. %로 말하는 것은 coverage이니 헷갈리면 안 돼요.", "src": "6주차 녹취(depth 설명) / 3주차 녹취 1:24, NGS 슬라이드 25쪽"}, {"id": "e61cad86", "ch": "depth", "type": "mc", "q": "레퍼런스 전체 중 10%가 한 번도 읽히지 않았다면 coverage(읽힌 비율 정의)는?", "choices": ["10%", "10x", "90x", "90%"], "answer": 3, "explain": "coverage는 읽힌 부분의 비율이에요. 10%가 한 번도 안 읽혔다면 90%는 읽힌 것이라서 90%예요. x가 붙는 단위는 depth에서 쓰는 거라 오답이에요.", "src": "6주차 녹취(26분 부근) / 3주차 녹취 1:24"}, {"id": "2031b8b7", "ch": "depth", "type": "ox", "q": "depth가 높을수록 한 read의 에러를 다른 read들이 보완해 주므로 진짜 변이와 시퀀싱 에러를 구분하기 쉬워진다.", "answer": true, "explain": "같은 자리를 여러 번 읽으면 한 번 틀린 것은 다른 read들이 바로잡아 줘요. 100번 읽어 하나만 다르면 에러로 볼 수 있지만, 2번 읽어 하나가 다르면 판단이 안 돼요. 그래서 맞는 말이에요.", "src": "3주차 녹취 1:28 / 6주차 녹취"}, {"id": "5cfc206e", "ch": "depth", "type": "mc", "q": "클러스터 2억(200M)개, paired-end로 100씩(2×100) 읽고 사람 게놈이 3.2Gb일 때, 슬라이드 25쪽의 계산 결과는?", "choices": ["12.5", "1.25", "40", "125"], "answer": 0, "explain": "200M개를 양쪽 100글자씩 읽으니 글자가 모두 400억 개예요. 이것을 사람 게놈 32억 개로 나누면 12.5라서 사람 게놈을 평균 12.5번 읽은 셈이에요.", "src": "3주차 녹취 1:21~1:24 / NGS 슬라이드 25쪽"}, {"id": "94557b15", "ch": "depth", "type": "mc", "q": "WGS·WES·Targeted gene panel 중 암처럼 낮은 비율의 변이(low VAF)를 임상에서 찾는 데 가장 적합하며 500x 이상으로 깊게 읽는 것은?", "choices": ["WGS", "Targeted gene panel", "WES", "Sanger 시퀀싱"], "answer": 1, "explain": "읽을 수 있는 양이 정해져 있어서 범위를 좁힐수록 깊게 읽을 수 있어요. 그래서 몇 개 유전자만 보는 Targeted panel이 500x 이상으로 가장 깊고, 낮은 비율의 변이(암)를 찾기에 좋아요. WGS는 약 30x, WES는 50~100x예요.", "src": "3주차 녹취 1:26~1:30 / NGS 슬라이드 29~31쪽"}, {"id": "40f3b8ad", "ch": "linux", "type": "mc", "q": "사용자가 입력한 명령어를 해석해 커널에 전달하는 ‘껍데기’ 역할의 프로그램은?", "choices": ["셸(shell, 예 bash)", "하드웨어", "루트 디렉토리", "BAM 파일"], "answer": 0, "explain": "사용자가 친 명령을 알아듣고 컴퓨터 안쪽(커널)에 전달하는 껍데기가 셸(shell)이에요. 이 수업에서는 bash를 써요. 하드웨어는 컴퓨터 부품이라서 오답이에요.", "src": "4주차 녹취 / NGS 슬라이드 47·50쪽"}, {"id": "fb765e58", "ch": "linux", "type": "short", "q": "파일 권한에서 r=4, w=2, x=1일 때, 읽기·쓰기·실행을 모두 허용하는 숫자 한 자리는?", "answer": "7", "alts": ["4+2+1", "7(4+2+1)"], "explain": "읽기는 4, 쓰기는 2, 실행은 1이라서 모두 합치면 4+2+1=7이에요. chmod 777이면 모두에게 모든 권한을 주는 거예요.", "src": "4주차 녹취 / NGS 슬라이드 63쪽"}, {"id": "a7ec6448", "ch": "linux", "type": "mc", "q": "4줄 1세트인 FASTQ 파일에서 염기서열(두 번째 줄)만 뽑는 awk 조건은?", "choices": ["NR%4==1", "NR%4==3", "NR%4==0", "NR%4==2"], "answer": 3, "explain": "NR은 줄 번호예요. FASTQ는 4줄이 한 세트라서 4로 나눈 나머지가 2인 줄이 두 번째 줄(염기서열)이에요. 나머지 1은 이름표, 0은 품질 점수 줄이에요.", "src": "4주차 녹취 / NGS 슬라이드 75쪽"}, {"id": "8311db65", "ch": "linux", "type": "ox", "q": "vi 편집기는 처음 열면 바로 글을 쓸 수 있는 입력 모드이고, Esc를 눌러야 명령 모드로 바뀐다.", "answer": false, "explain": "vi는 처음 열면 명령 모드라서 바로 글자가 써지지 않아요. i를 눌러 입력 모드로 바꾸고, Esc로 돌아와 저장해요. 그러니 처음부터 입력 모드라는 말은 틀려요.", "src": "4주차 녹취 / NGS 슬라이드 54~56쪽"}, {"id": "1bfe9e80", "ch": "practice", "type": "mc", "q": "실습 노트북 결과가 ‘total reads: 1187’이었다. FASTQ가 read당 4줄이라면 이 파일의 전체 줄 수는?", "choices": ["1,187줄", "4,748줄", "2,374줄", "5,935줄"], "answer": 1, "explain": "read가 1,187개이고 read 하나가 4줄이니 1,187에 4를 곱한 4,748줄이에요. 계산기로 한 번만 해 보면 맞아요.", "src": "3주차 실습 / read_fastq.ipynb"}, {"id": "dc67266b", "ch": "etc", "type": "short", "q": "질병이 있는 집단과 정상인의 전체 게놈을 비교해 질병과 연관된 변이를 찾는 연구 방법의 약어(영문 4글자)는?", "answer": "GWAS", "alts": ["gwas", "Genome-Wide Association Study", "Genome Wide Association Study"], "explain": "병이 있는 사람들과 정상인의 게놈 전체를 비교해 병과 관련된 변이를 찾는 방법이 GWAS(Genome-Wide Association Study)예요.", "src": "3주차 녹취 1:30 / NGS 슬라이드 32쪽"}, {"id": "6765a8eb", "ch": "qc", "type": "mc", "q": "FastQC의 Per base sequence quality 그래프에서 노란 박스가 나타내는 것은?", "choices": ["Q 값의 중앙값", "Q 값의 최솟값과 최댓값", "Q 값의 25%에서 75%까지 구간", "Q 값의 평균"], "answer": 2, "explain": "FastQC에서 노란 박스는 품질값의 25%에서 75% 구간이에요. 박스 안의 파란 선은 평균, 빨간 선은 중앙값이니 구별해서 외우세요.", "src": "7주차 슬라이드 19쪽"}, {"id": "f00712ea", "ch": "qc", "type": "mc", "q": "인서트가 50bp로 짧은데 150사이클을 읽으면 read의 뒷부분에는 무엇이 나타나는가?", "choices": ["같은 서열의 PCR 복제본", "샘플 바코드만 길게 반복", "레퍼런스의 다음 위치 서열", "어댑터 서열과 그 뒤의 노이즈"], "answer": 3, "explain": "조각(인서트)이 짧으면 기계는 그 뒤에 붙은 어댑터를 읽고, 그 뒤에는 읽을 게 없어서 노이즈를 읽어요. 어댑터는 진짜 DNA가 아니라서 잘라 내야 해요.", "src": "6주차 녹취 약 35:33~38:30"}, {"id": "8838103c", "ch": "qc", "type": "ox", "q": "어댑터를 자르지 않고 그대로 정렬한 데이터가 트리밍한 데이터보다 얼라인 비율이 더 높다.", "answer": false, "explain": "어댑터와 노이즈가 남아 있으면 레퍼런스에서 맞는 자리를 찾기 힘들어져요. 그래서 트리밍한 데이터가 얼라인 비율이 훨씬 높아요. 자르지 않은 것이 더 높다는 말은 틀려요.", "src": "6주차 녹취 약 1:19:34~1:20:41"}, {"id": "e50b8911", "ch": "qc", "type": "mc", "q": "2×150 페어드엔드로 읽고 R1과 R2가 약 50bp 겹칠 때, 합친 read의 대략적인 길이는?", "choices": ["약 150bp", "약 300bp", "약 250bp", "약 350bp"], "answer": 2, "explain": "150과 150을 더하면 300이지만 겹치는 50은 두 번 센 거라 한 번만 세요. 그래서 300에서 50을 뺀 약 250bp가 돼요.", "src": "6주차 녹취 약 18:07~20:12"}, {"id": "885c7e5b", "ch": "qc", "type": "ox", "q": "PEAR로 합쳐지지 않은(not assembled) read는 불량이므로 버려야 한다.", "answer": false, "explain": "합쳐지지 않았다고 불량은 아니에요. 겹치는 부분이 짧거나 없을 뿐이라서 버리지 않고 따로 정렬해서 분석해요.", "src": "6주차 녹취 약 1:10:16~1:11:19"}, {"id": "dffa8462", "ch": "align", "type": "mc", "q": "BWA가 BLAST보다 NGS 데이터를 훨씬 빠르게 정렬할 수 있는 핵심 이유는?", "choices": ["레퍼런스를 미리 인덱싱하고, seed로 후보 위치를 찾은 뒤 그 자리에서만 확장하기 때문", "read 전체를 레퍼런스의 모든 위치와 한 글자씩 비교하기 때문", "SAM 대신 FASTA를 바로 출력하기 때문", "품질이 낮은 read를 모두 버리기 때문"], "answer": 0, "explain": "BWA는 레퍼런스에 미리 찾아보기(인덱스)를 만들어 놓고, 짧은 조각(seed)으로 후보 위치를 찾은 다음 거기서만 넓혀 가며 맞춰요. 전부 한 글자씩 비교하는 것이 아니라서 훨씬 빨라요.", "src": "6주차 녹취 약 1:35:36~1:40:42, 7주차 슬라이드 54쪽"}, {"id": "f6bf9e90", "ch": "align", "type": "mc", "q": "다음 중 global alignment가 더 어울리는 상황은?", "choices": ["환자 DNA에서 SNP 한 개를 찾기", "산에서 캔 식물이 어느 종인지 큰 그림으로 찾기", "150bp read가 레퍼런스의 어느 위치인지 세밀히 확인하기", "indel의 정확한 위치 찾기"], "answer": 1, "explain": "global alignment는 숲을 보는 큰 그림용이라서 식물의 종을 대략 알아볼 때 어울려요. SNP나 indel처럼 세밀하게 봐야 하는 일은 나무를 보는 local alignment가 맞아요.", "src": "6주차 녹취 약 1:13:29~1:14:30"}, {"id": "a4014af6", "ch": "align", "type": "ox", "q": "변이(SNP 등)를 찾는 분석에서는 주로 local alignment를 사용한다.", "answer": true, "explain": "변이를 찾으려면 레퍼런스와 어디가 어떻게 다른지 세밀하게 봐야 해요. 그래서 비슷한 부분을 정밀하게 맞추는 local alignment를 많이 써요.", "src": "6주차 녹취 약 1:13:29~1:14:30"}, {"id": "c8b681fd", "ch": "align", "type": "short", "q": "BLAST의 풀네임을 영어로 쓰시오.", "answer": "Basic Local Alignment Search Tool", "alts": ["basic local alignment search tool"], "explain": "BLAST는 Basic Local Alignment Search Tool의 줄임말이에요. 웹에서 쓰는 전통적인 도구인데 NGS 데이터에는 너무 느려서 BWA 같은 새 도구가 나왔어요.", "src": "7주차 슬라이드 27쪽, 6주차 녹취 약 1:15:39"}, {"id": "018e1394", "ch": "align", "type": "ox", "q": "인간 레퍼런스의 버전(hg19, hg38 등)이 달라도 변이 분석 결과는 항상 같다.", "answer": false, "explain": "hg19와 hg38처럼 레퍼런스 버전이 다르면 위치와 변이 정보가 달라질 수 있어요. 그래서 항상 같은 버전을 써야 하고, 결과가 항상 같다는 말은 틀려요.", "src": "6주차 녹취 약 1:21:46"}, {"id": "5851b130", "ch": "align", "type": "mc", "q": "레퍼런스 게놈을 담는 FASTA 파일에 들어 있지 않은 것은?", "choices": ["ID 줄", "염기 서열", "염기별 품질 점수", "염색체별로 나뉜 서열"], "answer": 2, "explain": "FASTA에는 이름 줄과 염기서열만 있어요. 정답지라서 품질 점수가 필요 없어요. 품질 점수는 FASTQ의 네 번째 줄에 있어요.", "src": "6주차 녹취 약 1:21:46~1:22:49, 7주차 슬라이드 32쪽"}, {"id": "9f3ce463", "ch": "align", "type": "mc", "q": "레퍼런스의 10%가 한 번도 읽히지 않았다면 이 데이터의 coverage는?", "choices": ["10%", "90%", "10x", "90x"], "answer": 1, "explain": "coverage는 레퍼런스 중 한 번이라도 읽힌 비율이에요. 10%가 안 읽혔으니 90%가 읽힌 거예요. 10x나 90x는 depth에서 쓰는 단위라서 오답이에요.", "src": "6주차 녹취 약 26:36, 7주차 슬라이드 10쪽"}, {"id": "607bc02c", "ch": "align", "type": "mc", "q": "실습 결과에서 매핑된 read가 8,592,476개, read 길이가 약 150bp, chr20 길이가 64,444,167bp일 때 평균 depth는 대략 얼마인가?", "choices": ["약 2x", "약 20x", "약 200x", "약 99x"], "answer": 1, "explain": "depth는 읽은 글자 수를 레퍼런스 길이로 나눈 거예요. 8,592,476개에 150을 곱해 64,444,167로 나누면 약 20이 나와요. 99는 coverage(%)라서 depth와 다른 값이에요.", "src": "실습 PDF 28쪽, 7주차 슬라이드 10쪽"}, {"id": "931f9781", "ch": "align", "type": "ox", "q": "depth가 높을수록 한 read의 시퀀싱 에러를 다른 read들이 보완해 주어 변이 판정이 더 정확해진다.", "answer": true, "explain": "100번 읽어서 하나만 다르면 에러로 걸러 낼 수 있어요. 하지만 2번 읽었는데 A 하나, T 하나면 누가 맞는지 판단할 수 없어요. 그래서 depth가 높을수록 변이 판정이 정확해져요.", "src": "6주차 녹취 약 24:28~25:34, 7주차 녹취 약 1:32:00"}, {"id": "6b3a4f02", "ch": "sam", "type": "mc", "q": "CIGAR가 5M2I10M인 read의 길이는?", "choices": ["15", "17", "12", "10"], "answer": 1, "explain": "read의 길이는 M, I, S를 더한 값이에요. 5+2+10=17이에요. I는 read에는 있지만 레퍼런스에는 없는 글자라서 read 길이에는 포함돼요. 15는 레퍼런스에서 차지하는 길이예요.", "src": "7주차 슬라이드 44쪽, 6주차 녹취 약 1:27:19~1:30:33"}, {"id": "750c44c0", "ch": "sam", "type": "mc", "q": "POS가 5이고 CIGAR가 3M1I3M1D5M인 read가 레퍼런스에서 마지막으로 놓이는 위치는?", "choices": ["15번", "16번", "17번", "12번"], "answer": 1, "explain": "레퍼런스를 차지하는 칸은 M과 D만 세요. 3+3+1+5=12칸이에요. 5번에서 시작해서 12칸이면 16번에서 끝나요. I는 레퍼런스에 없는 글자라서 세지 않아요.", "src": "7주차 슬라이드 45쪽, 6주차 녹취 약 1:29:19~1:30:33"}, {"id": "84a7baac", "ch": "sam", "type": "mc", "q": "CIGAR가 5S8M2D11M6S일 때 레퍼런스에서 차지하는 염기 수는?", "choices": ["30", "21", "19", "27"], "answer": 1, "explain": "레퍼런스를 차지하는 길이는 M과 D를 더해요. 8+2+11=21이에요. S는 레퍼런스에 놓이지 않고 read에만 남은 끝부분이라 세지 않아요. 30은 read 전체 길이예요.", "src": "7주차 슬라이드 44쪽"}, {"id": "11f8e769", "ch": "sam", "type": "ox", "q": "CIGAR의 D(deletion)는 read에는 있고 레퍼런스에는 없는 염기를 뜻한다.", "answer": false, "explain": "반대로 말했어요. D(deletion)는 레퍼런스에는 있는데 read에는 없는 글자예요. read에만 있는 글자는 I(insertion)예요.", "src": "7주차 슬라이드 44쪽, 6주차 녹취 약 1:28:11"}, {"id": "c72aaf4a", "ch": "sam", "type": "short", "q": "CIGAR에서 soft clipping을 나타내는 문자 하나를 쓰시오.", "answer": "S", "alts": ["s"], "explain": "CIGAR에서 soft clipping은 S로 적어요. M은 일치, I는 삽입, D는 결실이에요.", "src": "6주차 녹취 약 1:28:11, 7주차 슬라이드 44쪽"}, {"id": "ad11e0a7", "ch": "sam", "type": "mc", "q": "SAM 파일의 FLAG가 16이면 무엇을 뜻하는가?", "choices": ["매핑되지 않음", "PCR 중복으로 판정됨", "forward 방향으로 매핑됨", "reverse 방향으로 매핑됨"], "answer": 3, "explain": "FLAG 0은 정방향, 16은 반대 방향(reverse)으로 붙었다는 뜻이에요. 4는 매핑이 안 된 read예요. 그래서 16은 reverse예요.", "src": "6주차 녹취 약 1:24:57~1:25:53, 7주차 슬라이드 37~39쪽"}, {"id": "f05c11d9", "ch": "sam", "type": "mc", "q": "SAM의 MAPQ가 60이라는 것은 무슨 뜻인가?", "choices": ["매핑이 틀렸을 확률이 약 10의 -6승이라 매우 잘 붙은 것", "read의 60%만 레퍼런스와 일치", "미스매치가 60개 있음", "60번째 염색체에 매핑됨"], "answer": 0, "explain": "MAPQ도 Phred 점수와 같은 방식이에요. 60이면 잘못 붙었을 확률이 10의 마이너스 6제곱(백만분의 일)이라 아주 잘 붙은 거예요. 점수가 높을수록 믿을 만해요.", "src": "7주차 녹취 약 1:45:44~1:46:00, 7주차 슬라이드 37쪽"}, {"id": "eae89181", "ch": "sam", "type": "mc", "q": "SAM 태그가 MD:Z:38, NM:i:0이면 무엇을 뜻하는가?", "choices": ["MAPQ가 38이고 NM이 0", "38염기 중 미스매치 0개, 전부 일치", "38염기 중 미스매치 38개", "38번 위치에서 deletion 발생"], "answer": 1, "explain": "MD:Z:38은 38개가 연속으로 일치한다는 뜻이고, NM:i:0은 다른 글자가 0개라는 뜻이에요. 그래서 38개 모두 레퍼런스와 같아요.", "src": "6주차 녹취 약 1:31:09~1:33:23, 7주차 슬라이드 46쪽"}, {"id": "e4976c54", "ch": "sam", "type": "short", "q": "'bwa mem ... | samtools sort' 에서 앞 프로그램의 결과를 저장하지 않고 곧바로 뒤 프로그램에 넘겨 주는 기호(명령어 연결 방식)의 이름은?", "answer": "파이프", "alts": ["pipe", "|", "파이프(|)", "파이프 (|)"], "explain": "|(파이프)는 앞 프로그램의 결과를 저장하지 않고 바로 뒤 프로그램에 넘겨 주는 기호예요. 아주 큰 SAM 파일을 저장하고 지우는 수고를 덜어요.", "src": "6주차 녹취 약 1:58:28~1:59:37, 실습 PDF 27쪽"}, {"id": "91bfcd0b", "ch": "sam", "type": "mc", "q": "정렬된 BAM 파일 옆에 samtools index로 만드는 .bai 파일의 역할은?", "choices": ["VCF 파일의 인덱스", "SAM 헤더의 백업", "BAM 파일의 인덱스", "레퍼런스 FASTA의 인덱스"], "answer": 2, "explain": ".bai는 BAM 파일의 찾아보기(인덱스) 파일이에요. 레퍼런스 FASTA의 인덱스는 .fai로 이름이 비슷해서 헷갈리기 쉬워요.", "src": "7주차 녹취 약 25:34, 50:05, 실습 PDF 29쪽"}, {"id": "561e879c", "ch": "sam", "type": "mc", "q": "SAM/BAM을 samtools sort로 정렬하는 이유로 가장 알맞은 것은?", "choices": ["품질 점수를 올리려고", "어댑터를 제거하려고", "파일 용량을 줄이려고", "염색체·위치 순으로 줄 세워야 다음 단계(변이 호출)와 IGV가 제대로 동작하기 때문"], "answer": 3, "explain": "염색체와 위치 순서대로 줄 세워야 다음 단계(변이 찾기)와 IGV가 원하는 곳을 바로 찾아가요. sort는 정리용이 아니라 필수 작업이에요. 용량을 줄이는 것은 SAM을 BAM으로 바꾸는 일이에요.", "src": "6주차 녹취 약 1:41:47~1:43:49, 7주차 슬라이드 56쪽"}, {"id": "36bf5ea2", "ch": "post", "type": "mc", "q": "MarkDuplicates에서 PCR 중복 read로 판정하는 기준은?", "choices": ["Chr·Position·CIGAR 정보가 일치한다 (시작점과 끝점이 같다)", "MAPQ가 0이다", "품질 점수가 Q30 미만이다", "read 이름이 같다"], "answer": 0, "explain": "랜덤하게 자른 DNA는 시작점과 끝점이 우연히 같을 일이 거의 없어요. 그래서 위치와 CIGAR가 같은 read는 PCR로 복사된 같은 조각이라고 보고 하나만 남겨요.", "src": "7주차 슬라이드 64쪽, 7주차 녹취 약 57:20"}, {"id": "c4dff02c", "ch": "post", "type": "mc", "q": "MarkDuplicates 단계를 생략해도 되는 경우는?", "choices": ["depth가 30x 이상일 때", "PCR로 특정 부위만 증폭한 amplicon(targeted) 데이터일 때", "페어드엔드로 읽었을 때", "레퍼런스가 hg38일 때"], "answer": 1, "explain": "amplicon은 PCR로 특정 부위만 늘린 것이라서 원래 모든 read의 시작과 끝이 같아요. 그래서 중복 제거를 하면 거의 다 사라져요. 이때는 MarkDuplicates를 건너뛰어요.", "src": "7주차 녹취 약 59:26~1:00:25"}, {"id": "4b7ed174", "ch": "post", "type": "ox", "q": "실습에서 flagstat의 duplicates는 정렬 직후에는 0이었고, MarkDuplicates 뒤에는 1,542로 올라갔다.", "answer": true, "explain": "정렬 직후에는 아직 중복을 찾지 않아서 duplicates가 0이에요. MarkDuplicates를 하고 나면 중복으로 판정된 read 1,542개가 표시돼요. 그래서 맞는 말이에요.", "src": "실습 PDF 32쪽, 7주차 녹취 약 1:13:36~1:14:34"}, {"id": "1dc8adbf", "ch": "post", "type": "mc", "q": "BQSR의 목적으로 가장 알맞은 것은?", "choices": ["변이의 질병 관련성을 DB로 찾는다", "PCR 복제본을 제거한다", "알려진 SNP DB를 참고해 품질 점수의 bias를 보정해, 에러를 진짜 변이로 오인하는 것을 줄인다", "어댑터를 자른다"], "answer": 2, "explain": "기계가 매긴 품질 점수에는 치우침(bias)이 있어요. BQSR은 알려진 SNP 목록(dbSNP)을 참고해서 품질 점수를 다시 보정해요. 그래서 에러를 진짜 변이로 착각하는 일이 줄어요.", "src": "7주차 슬라이드 65·66쪽, 7주차 녹취 약 1:03:34~1:06:27"}, {"id": "ee644e7e", "ch": "post", "type": "short", "q": "BQSR의 풀네임을 영어로 쓰시오.", "answer": "Base Quality Score Recalibration", "alts": ["base quality score recalibration"], "explain": "BQSR은 Base Quality Score Recalibration의 줄임말이에요. 염기(Base)의 품질 점수(Quality Score)를 다시(Re) 보정(calibration)한다는 뜻이에요.", "src": "7주차 슬라이드 65·66쪽"}, {"id": "dd644d7b", "ch": "post", "type": "mc", "q": "수업에서 설명한 분석 순서로 올바른 것은?", "choices": ["FASTQ → BWA 정렬 → HaplotypeCaller → BQSR → MarkDuplicates → ANNOVAR", "FASTQ → MarkDuplicates → BWA 정렬 → QC → BQSR → HaplotypeCaller", "FASTQ → ANNOVAR → HaplotypeCaller → BWA 정렬 → BQSR", "FASTQ → QC → 트리밍 → BWA 정렬 → sort·index → MarkDuplicates → BQSR → HaplotypeCaller → 필터 → ANNOVAR"], "answer": 3, "explain": "먼저 품질 검사와 트리밍을 하고, BWA로 정렬한 뒤 sort와 index를 해요. 그다음 MarkDuplicates, BQSR, HaplotypeCaller, 필터, ANNOVAR 순서예요. 다른 보기들은 순서가 뒤죽박죽이에요.", "src": "7주차 녹취 약 54:59~55:59, 7주차 슬라이드 49·61·69쪽"}, {"id": "f1603a92", "ch": "variant", "type": "mc", "q": "VCF의 FORMAT 필드에서 GT가 0/0이면 무슨 뜻인가?", "choices": ["변이 없음 (레퍼런스와 같음)", "두 염색체 모두 변이", "한 염색체에만 변이", "변이 호출 실패"], "answer": 0, "explain": "VCF에서 0은 레퍼런스와 같은 글자, 1은 바뀐 글자예요. 0/0은 두 염색체 모두 같은 글자라서 변이가 없다는 뜻이에요.", "src": "7주차 녹취 약 1:29:57, 7주차 슬라이드 76·77쪽"}, {"id": "fb8ec734", "ch": "variant", "type": "mc", "q": "다음 중 '변이가 있다'고 해석하는 GT를 모두 포함한 것은?", "choices": ["0/0과 0/1", "0/1과 1/1", "0/0과 1/1", "0/0만"], "answer": 1, "explain": "0/1은 두 염색체 중 하나만, 1/1은 두 염색체 모두 바뀐 글자예요. 둘 다 변이가 있어요. 0/0은 변이가 없으니 제외해야 해요.", "src": "7주차 슬라이드 76·77쪽"}, {"id": "5bc8e0b7", "ch": "variant", "type": "mc", "q": "VCF에서 REF가 ACG이고 ALT가 A인 변이의 종류는?", "choices": ["SNP", "insertion", "deletion (CG가 결실)", "large structural variation"], "answer": 2, "explain": "REF는 ACG인데 ALT는 A라서 글자가 줄었어요. CG가 사라진 deletion이에요. 글자 하나만 바뀌면 SNP, 글자가 늘면 insertion이에요.", "src": "7주차 녹취 약 1:28:54, 7주차 슬라이드 75쪽"}, {"id": "31ff0d5b", "ch": "variant", "type": "short", "q": "REF가 G이고 ALT가 A처럼 염기 하나가 바뀐 변이를 영문 약어 세 글자로 쓰시오.", "answer": "SNP", "alts": ["SNV", "snp", "snv"], "explain": "G가 A로 글자 하나만 바뀌었으니 SNP예요. 거의 같은 뜻으로 SNV도 인정돼요. 글자 수가 달라지면 insertion이나 deletion이에요.", "src": "7주차 녹취 약 1:28:54"}, {"id": "1eb14f52", "ch": "variant", "type": "mc", "q": "GVCF 파일에서 NON_REF로 표시된 위치는 무슨 뜻인가?", "choices": ["확실한 변이가 있는 위치", "레퍼런스와 완전히 같다고 확정된 위치", "구조 변이가 있는 위치", "coverage가 낮거나 read 품질이 낮아 변이인지 판단할 수 없는 위치"], "answer": 3, "explain": "GVCF는 확실한 변이뿐 아니라 판단이 어려운 자리까지 모두 적어요. 그런 애매한 자리에 NON_REF 표시가 붙는다고 수업에서 배웠어요. VCF는 확실한 변이만 담아요.", "src": "7주차 녹취 약 1:23:43~1:24:41, 7주차 슬라이드 74쪽"}, {"id": "cd2c16ae", "ch": "variant", "type": "short", "q": "GATK의 풀네임을 영어로 쓰시오.", "answer": "Genome Analysis Toolkit", "alts": ["Genome Analysis Tool Kit", "genome analysis toolkit"], "explain": "GATK는 Genome Analysis Toolkit의 줄임말이에요. 하버드와 MIT가 함께 만든 Broad Institute에서 만든 변이 분석 도구 모음이에요.", "src": "7주차 슬라이드 71쪽, 7주차 녹취 약 1:16:42"}, {"id": "62bd6559", "ch": "variant", "type": "mc", "q": "GATK HaplotypeCaller가 가장 먼저 하는 일은?", "choices": ["변이가 몰린 active region을 설정한다", "PCR 중복을 제거한다", "품질 점수를 재보정한다", "ClinVar로 질병 관련성을 찾는다"], "answer": 0, "explain": "게놈 전체를 다 보기엔 너무 많아서 HaplotypeCaller는 변이가 있을 것 같은 구간(active region)부터 골라요. 그다음 그 안에서 확률을 계산해 변이를 찾아요. PCR 중복 제거나 점수 보정은 그 전 단계 일이에요.", "src": "7주차 슬라이드 71쪽, 7주차 녹취 약 1:16:42~1:17:50"}, {"id": "904f09ad", "ch": "variant", "type": "ox", "q": "Haplotype은 한 염색체 위에서 함께 유전되는 여러 변이(allele)의 조합이다.", "answer": true, "explain": "haplotype은 한 염색체 위에서 같이 물려받는 변이들의 묶음이에요. 예를 들어 엄마에게서는 A-C-G, 아빠에게서는 G-T-G처럼 묶음으로 따라다녀요. 묶음에 맞는 read는 진짜 변이, 어긋나면 에러일 가능성이 커요.", "src": "7주차 슬라이드 71쪽, 7주차 녹취 약 1:18:52~1:20:07"}, {"id": "0ba0cf56", "ch": "variant", "type": "mc", "q": "하드 필터를 적용한 VCF에서 FILTER 칼럼이 PASS인 변이는?", "choices": ["annotation이 끝난 변이", "설정한 모든 필터 조건을 통과한 변이", "매핑 품질(MQ)이 낮아 탈락한 변이", "레퍼런스와 같은 위치"], "answer": 1, "explain": "PASS는 설정한 모든 필터 조건을 통과했다는 뜻이에요. 통과하지 못하면 걸린 필터 이름이 대신 적혀요. 예를 들어 MQ_filter는 매핑 품질 필터에서 떨어졌다는 표시예요.", "src": "실습 PDF 36쪽, 7주차 녹취 약 1:44:47~1:45:44"}, {"id": "733c7eb4", "ch": "variant", "type": "ox", "q": "진짜 희귀 변이를 찾을 때는 하드 필터를 쓰지 않고 분석하기도 한다.", "answer": true, "explain": "필터는 확실한 호출만 필요할 때 써요. 하지만 희귀한 변이는 하나하나가 소중해서 필터로 버리면 안 될 수도 있어서 필터를 안 쓰기도 해요. 목적에 따라 분석 방법을 정해요.", "src": "7주차 녹취 약 1:43:40~1:44:47"}, {"id": "607e4e9f", "ch": "annot", "type": "short", "q": "ANNOVAR의 풀네임을 영어로 쓰시오.", "answer": "ANNOtate VARiation", "alts": ["annotate variation", "Annotate Variation"], "explain": "ANNOVAR는 ANNOtate VARiation의 줄임말이에요. 찾은 변이가 무슨 의미인지 데이터베이스와 연결해 주는 프로그램이에요.", "src": "7주차 슬라이드 86쪽, 7주차 녹취 약 1:48:00"}, {"id": "aeec88eb", "ch": "annot", "type": "mc", "q": "찾은 변이가 질병과 관련 있다고 알려졌는지(pathogenic, benign) 볼 때 쓰는 DB는?", "choices": ["1000 Genomes", "dbNSFP", "ClinVar", "dbSNP"], "answer": 2, "explain": "질병과 관련 있는지(pathogenic, benign)는 ClinVar에 있어요. dbSNP는 변이의 이름표, 1000 Genomes는 일반인에게 흔한지, dbNSFP는 단백질 기능에 영향을 주는지를 알려 줘요.", "src": "7주차 슬라이드 88쪽, 7주차 녹취 약 1:50:47~1:51:53"}, {"id": "93cdd2a8", "ch": "annot", "type": "mc", "q": "ANNOVAR의 annotation 방식 중 '특정 DB에 존재하는 변이인지' 확인하는 방식은?", "choices": ["Gene-based", "Region-based", "Allele-based", "Filter-based"], "answer": 3, "explain": "Filter-based는 이 변이가 특정 데이터베이스에 있는지 확인하는 방식이에요. Gene-based는 단백질을 만드는 영역인지, Region-based는 전사인자 결합부위 같은 기능 구역인지 봐요.", "src": "7주차 슬라이드 87쪽, 7주차 녹취 약 1:48:47~1:49:45"}, {"id": "e11a797e", "ch": "practice", "type": "short", "q": "정렬 결과(BAM)를 눈으로 확인하는 프로그램 IGV의 풀네임을 영어로 쓰시오.", "answer": "Integrative Genomics Viewer", "alts": ["integrative genomics viewer"], "explain": "IGV는 Integrative Genomics Viewer의 줄임말이에요. 정렬된 BAM과 BAI를 올리면 read가 쌓인 모습, depth를 나타내는 회색 막대, 틀린 글자를 색깔로 볼 수 있어요.", "src": "7주차 슬라이드 57쪽, 실습 PDF 29·30쪽"}];window.CHS=[{"id": "c0", "title": "왕초보 생명 기초", "groups": ["basic"]}, {"id": "c1", "title": "큰 그림 — 파이프라인", "groups": ["big", "etc"]}, {"id": "c2", "title": "바이오 기초", "groups": ["bio"]}, {"id": "c3", "title": "NGS", "groups": ["ngs"]}, {"id": "c4", "title": "FASTQ와 품질 점수", "groups": ["fastq"]}, {"id": "c5", "title": "Depth · 어디를 읽을까", "groups": ["depth"]}, {"id": "c6", "title": "QC → 얼라인먼트 → BAM", "groups": ["qc", "align", "sam", "linux"]}, {"id": "c7", "title": "진짜 변이 골라내기", "groups": ["post", "variant"]}, {"id": "c8", "title": "Annotation", "groups": ["annot"]}, {"id": "c9", "title": "실습 따라가기", "groups": ["practice"]}];</script>
